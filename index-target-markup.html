<!--
  MASTER MIND TARGET ORDER
  0 = IDIS shared side
  1 = Atlanta physical coin
  2 = Chicago physical coin
  3 = Atlanta paper card
-->

<a-scene
  id="ar-scene"
  class="ar-stage"
  mindar-image="imageTargetSrc: ./assets/targets/idis-collection-2026.mind;
                autoStart: false;
                uiLoading: no;
                uiError: no;
                uiScanning: no;
                filterMinCF: 0.0001;
                filterBeta: 0.001;
                warmupTolerance: 8;
                missTolerance: 20;
                maxTrack: 2;"
  color-space="sRGB"
  renderer="colorManagement: true; alpha: true; antialias: false;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  loading-screen="enabled: false"
  embedded>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="idis-target"
            mindar-image-target="targetIndex: 0"></a-entity>

  <a-entity id="atlanta-target"
            mindar-image-target="targetIndex: 1"></a-entity>

  <a-entity id="chicago-target"
            mindar-image-target="targetIndex: 2"></a-entity>

  <a-entity id="atlanta-paper-target"
            mindar-image-target="targetIndex: 3"></a-entity>

</a-scene>
