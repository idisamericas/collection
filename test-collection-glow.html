<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection Glow Test</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 25% 15%,#133d55 0,transparent 30%),radial-gradient(circle at 75% 25%,#31214e 0,transparent 34%),#02080c;color:white;font-family:Arial,sans-serif}.wrap{text-align:center;padding:28px}.label{font-size:11px;letter-spacing:.18em;color:#80fff4;margin-bottom:16px}.collection{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;text-decoration:none;color:#fff9df;border:1px solid rgba(255,222,116,.82);background:linear-gradient(110deg,rgba(100,63,5,.92),rgba(227,184,65,.92) 43%,rgba(126,78,7,.92));box-shadow:0 0 0 1px rgba(255,255,255,.72),0 0 16px rgba(255,255,255,.46),0 0 34px rgba(245,207,95,.32),inset 0 1px rgba(255,255,255,.45);font-size:12px;font-weight:900;letter-spacing:.1em;animation:pulse 1.5s ease-in-out infinite}@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 1px rgba(255,255,255,.62),0 0 11px rgba(255,255,255,.32),0 0 26px rgba(245,207,95,.24)}50%{transform:scale(1.04);box-shadow:0 0 0 2px white,0 0 26px rgba(255,255,255,.82),0 0 48px rgba(245,207,95,.5)}}.note{max-width:330px;margin:18px auto 0;color:#93a5aa;font-size:12px;line-height:1.55}</style></head><body><div class="wrap"><div class="label">NEWLY COLLECTED STATE</div><a class="collection" href="#"><span>YOUR COLLECTION</span><span>•</span><span>1 / 5</span><span>›</span></a><p class="note">This is the gold shine and white pulse that appears after a new coin has been collected and remains until the collection is opened.</p></div></body></html>
