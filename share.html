<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#02070a" />
  <title>IDIS Americas | Share the Collection</title>
  <link rel="icon" type="image/png" href="./assets/ui/favicon-coin.png" />
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#02070a;color:#fff;font-family:Arial,Helvetica,sans-serif}body{min-height:100svh;background:radial-gradient(circle at 12% 18%,rgba(0,211,218,.17),transparent 29%),radial-gradient(circle at 88% 30%,rgba(101,69,255,.22),transparent 37%),linear-gradient(155deg,#02070a,#07161c 48%,#03070a);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.016) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.016) 1px,transparent 1px);background-size:50px 50px;mask-image:radial-gradient(circle at 50% 42%,black,transparent 78%)}
    .close{position:fixed;z-index:20;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(3,12,16,.72);color:#fff;font-size:28px;line-height:38px;text-align:center;text-decoration:none;backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.36)}
    main{position:relative;z-index:2;width:min(100%,620px);min-height:100svh;margin:auto;padding:max(36px,calc(env(safe-area-inset-top) + 24px)) 18px max(30px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.logo{width:106px;max-width:34vw;margin:0 0 18px}.kicker{font-size:8px;font-weight:900;letter-spacing:.24em;color:#7cfff5}h1{margin:8px 0 7px;font-size:clamp(34px,10vw,58px);line-height:.96;letter-spacing:-.045em}.lead{max-width:480px;margin:0;color:rgba(239,248,249,.60);font-size:12px;line-height:1.58}
    .qr-card{width:min(88vw,390px);margin:24px auto 18px;padding:14px;border:1px solid rgba(129,255,247,.18);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.065),rgba(255,255,255,.018));box-shadow:inset 0 1px rgba(255,255,255,.10),0 30px 80px rgba(0,0,0,.42),0 0 32px rgba(50,231,222,.08);backdrop-filter:blur(18px)}.qr-shell{padding:13px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}.qr-shell img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:contain}.scan-note{margin-top:11px;color:rgba(255,255,255,.40);font-size:7px;font-weight:850;letter-spacing:.17em}
    .url-card{width:min(100%,520px);margin-top:3px;padding:13px;border:1px solid rgba(255,255,255,.10);border-radius:14px;background:rgba(1,8,11,.54);color:rgba(230,251,250,.70);font-size:9px;line-height:1.45;overflow-wrap:anywhere}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;width:min(100%,520px);margin-top:11px}.actions button,.actions a{min-height:52px;border-radius:14px;border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:8px;font-weight:950;letter-spacing:.12em}.share{background:linear-gradient(110deg,#17aeb1,#70fff4 47%,#52b5e9);color:#031013;border-color:rgba(125,255,246,.45)!important}.copy{background:linear-gradient(115deg,#aeb7bb,#f9fbfb 28%,#879398 53%,#f4f6f6 77%,#858f94);color:#061014}.status{min-height:18px;margin-top:9px;color:#79fff4;font-size:8px;font-weight:850;letter-spacing:.08em}.mantra{margin-top:14px;font-size:7px;font-weight:900;letter-spacing:.27em;color:rgba(255,255,255,.35)}.mantra i{font-style:normal;color:#5cefe6;margin:0 7px}@media(max-width:390px){.actions{grid-template-columns:1fr}.qr-card{width:min(86vw,350px)}}
  </style>
</head>
<body>
  <a class="close" href="./index.html" aria-label="Close share page">×</a>
  <main>
    <img class="logo" src="./assets/ui/idis-logo.png" alt="IDIS Americas" />
    <div class="kicker">SHARE THE LIMITED COLLECTION</div>
    <h1>Scan. Share.<br>Discover.</h1>
    <p class="lead">Invite someone into the IDIS limited coin experience. Scan the code below, use your phone’s share sheet, or copy the collection link.</p>

    <div class="qr-card">
      <div class="qr-shell"><img src="./assets/ui/share-qr.png" alt="QR code for the IDIS Americas limited coin collection landing page" /></div>
      <div class="scan-note">SCAN TO OPEN THE COLLECTION</div>
    </div>

    <div id="share-url" class="url-card">https://idisamericas.github.io/collection/index.html</div>
    <div class="actions">
      <button id="native-share" class="share" type="button">SHARE BY TEXT / SOCIAL</button>
      <button id="copy-link" class="copy" type="button">COPY LINK</button>
    </div>
    <div id="share-status" class="status" aria-live="polite"></div>
    <div class="mantra">COLLECT <i>•</i> SCAN <i>•</i> DISCOVER</div>
  </main>
<script>
(()=>{
  const url='https://idisamericas.github.io/collection/index.html';
  const status=document.getElementById('share-status');
  const copy=async()=>{
    try{
      await navigator.clipboard.writeText(url);
      status.textContent='LINK COPIED';
    }catch(_){
      const input=document.createElement('textarea');input.value=url;input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();
      try{document.execCommand('copy');status.textContent='LINK COPIED'}catch(__){status.textContent='PRESS AND HOLD THE LINK ABOVE TO COPY'}
      input.remove();
    }
    setTimeout(()=>{status.textContent=''},2200);
  };
  document.getElementById('copy-link').addEventListener('click',copy);
  document.getElementById('native-share').addEventListener('click',async()=>{
    if(navigator.share){
      try{await navigator.share({title:'IDIS Limited Coin Collection',text:'Explore the IDIS Americas limited coin collection.',url});status.textContent='SHARED'}catch(error){if(error?.name!=='AbortError')await copy()}
    }else{await copy()}
  });
})();
</script>
</body>
</html>
