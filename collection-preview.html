<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="./assets/ui/favicon-coin.png?v=20260826-locallite41" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IDIS Collection Carousel Preview</title>
<style>
:root{--teal:#18c9c3;--teal2:#65fff1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:28px;background:
radial-gradient(circle at 18% 18%,rgba(24,201,195,.18),transparent 32%),
linear-gradient(145deg,#020507,#071116 52%,#04080b);color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:680px;margin:auto}
.logo{width:150px;margin-bottom:22px}
.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:10px}
.kicker{font-size:10px;font-weight:900;letter-spacing:.18em;color:var(--teal2)}
.sub{font-size:10px;opacity:.4;margin-top:5px}
.carousel{display:flex;gap:11px;overflow-x:auto;padding:4px 4px 14px;scroll-snap-type:x proximity}
.card{flex:0 0 150px;height:178px;padding:11px;border-radius:18px;border:1px solid rgba(101,255,241,.2);
background:rgba(4,11,15,.72);box-shadow:0 15px 34px rgba(0,0,0,.3);scroll-snap-align:start}
.coin{position:relative;width:78px;height:78px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center}
.coin:before{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid rgba(101,255,241,.48);
box-shadow:0 8px 24px rgba(0,0,0,.4),0 0 24px rgba(24,201,195,.12)}
.coin img{width:100%;height:100%;object-fit:contain;border-radius:50%;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
.title{font-size:11px;font-weight:900}.meta{margin-top:6px;font-size:7px;line-height:1.55;opacity:.72}
.replay{margin-top:5px;font-size:6px;font-weight:900;letter-spacing:.1em;color:var(--teal2)}
.future{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.ring{width:76px;height:76px;border-radius:50%;border:1px solid rgba(101,255,241,.34);display:grid;place-items:center;
font-size:30px;color:rgba(101,255,241,.3);box-shadow:0 9px 26px rgba(0,0,0,.35),0 0 24px rgba(24,201,195,.08);margin-bottom:13px}
.future strong{font-size:8px;opacity:.35;letter-spacing:.1em}.future small{font-size:6px;opacity:.22;margin-top:5px;letter-spacing:.12em}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="./assets/ui/idis-logo.png" alt="IDIS Americas">
  <div class="heading">
    <div><div class="kicker">YOUR COLLECTION</div><div class="sub">Collect. Keep. Replay.</div></div>
    <div style="font-size:10px;opacity:.7">1 / 5</div>
  </div>
  <div class="carousel">
    <div class="card">
      <div class="coin"><img src="./assets/reference/GSX2026-Coin-Back.png" alt=""></div>
      <div class="title">GSX 2026</div>
      <div class="meta">YEAR 2026<br>DATE SEP 14–16<br>LOCATION ATLANTA, GA</div>
      <div class="replay">TAP TO REPLAY EXPERIENCE</div>
    </div>
    <div class="card future"><div class="ring">+</div><strong>FUTURE DROP</strong><small>COMING SOON</small></div>
    <div class="card future"><div class="ring">+</div><strong>FUTURE DROP</strong><small>COMING SOON</small></div>
    <div class="card future"><div class="ring">+</div><strong>FUTURE DROP</strong><small>COMING SOON</small></div>
    <div class="card future"><div class="ring">+</div><strong>FUTURE DROP</strong><small>COMING SOON</small></div>
  </div>
</div>
</body>
</html>
