<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platform Diagnostics</title><style>body{font:14px Arial;background:#071014;color:#fff;padding:22px;line-height:1.5}main{max-width:850px;margin:auto}.row{padding:10px 0;border-bottom:1px solid #193035}.ok{color:#86ffd9}.bad{color:#ffb1b1}.warn{color:#ffd489}code{color:#9ff7ee}</style><script src="./platform/platform-config.js"></script></head><body><main><h1>Collectible Platform Diagnostics</h1><div id="out"></div><p><a href="./" style="color:#9ff7ee">Return home</a></p></main><script>
(async()=>{const out=document.querySelector('#out'),rows=[];const add=(n,v,s='ok')=>rows.push(`<div class="row"><strong>${n}</strong><br><span class="${s}">${v}</span></div>`);add('Secure context',String(isSecureContext),isSecureContext?'ok':'bad');add('localStorage',(()=>{try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return'Available'}catch(e){return'Blocked'}})());add('WebGL',(()=>{const c=document.createElement('canvas');return!!(c.getContext('webgl2')||c.getContext('webgl'))})()?'Available':'Unavailable');add('Supabase config',(window.IDIS_PLATFORM_CONFIG?.supabaseUrl&&window.IDIS_PLATFORM_CONFIG?.supabasePublishableKey)?'Configured':'Not configured','warn');for(const path of ['./assets/thumbs/gsx2026-atlanta.webp','./assets/targets/gsx2026-two-sided.mind','./assets/audio/state-voiceover.mp3','./assets/video/idis-showcase-alpha.webm','./assets/parallax/atlanta/layer-1-back.mp4','./assets/parallax/atlanta/layer-2-middle.png','./assets/parallax/atlanta/layer-3-front.png']){try{const r=await fetch(path,{method:'HEAD',cache:'no-store'});const bytes=Number(r.headers.get('content-length'))||0;add(path,r.ok?`OK${bytes?' · '+(bytes/1024/1024).toFixed(2)+' MB':''}`:`HTTP ${r.status}`,r.ok?'ok':'bad')}catch(e){add(path,e.message,'bad')}}out.innerHTML=rows.join('')})();
</script></body></html>
